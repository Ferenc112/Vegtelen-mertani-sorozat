    <h1>Végtelen Mértani Sorozat</h1>


<label>q értéke:
<input type="range" id="q" min="-1.5" max="1.5" step="0.01" value="0.5">
</label>
<span id="qErtek">0.50</span>

<p><strong>Sorozat:</strong> 1 + q + q² + q³ + …</p>

<p><strong>Első 10 tag:</strong></p>
<div class="diagram" id="diagram"></div>

<p><strong>Véges összeg (10 tag):</strong>
<span id="veg">–</span>
</p>

<p><strong>Végtelen összeg:</strong>
<span id="vegtelen">–</span>
</p>
