<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Végtelen Mértani Sorozat</title>
</head>
<body>
    <h1>Végtelen Mértani Sorozat</h1>

    <div class="csuszka>
        <label for="csuszka">Érték:</label>
        <input
        type="range"
        id="csuszka"
        min="-1"
        max="1"
        step="0.01"
        value="0.50"
        oninput="ertek.textContent = Number(this.value).toFixed(2)">

        <span id="ertek">0.50</span>
    </div>

    <div class="sorozat">
        <h2>Sorozat: 1+p + p2 +p3</h2>
        <p id="osszeg"></p>
        <p id="vegtelenoszeg"></p>
    </div>


    <script src="script.js"></script>
</body>
</html>
